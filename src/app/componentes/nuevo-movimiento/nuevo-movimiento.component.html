<div class="card shadow-sm border-0">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <span class="fw-semibold">Nuevo movimiento</span>
    <span class="badge bg-light text-primary">Hijo</span>
  </div>

  <div class="card-body">
    <form (ngSubmit)="registrar()">
      <div class="mb-3">
        <label for="tipoMovimiento" class="form-label fw-medium">Tipo de movimiento</label>
        <select
          id="tipoMovimiento"
          name="tipo"
          class="form-select"
          [(ngModel)]="tipo">
          <option value="Gasto">Gasto</option>
          <option value="Recarga">Recarga</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="montoMovimiento" class="form-label fw-medium">Monto (S/)</label>
        <input
          id="montoMovimiento"
          name="monto"
          type="number"
          step="0.01"
          min="0.01"
          placeholder="0.00"
          class="form-control"
          [(ngModel)]="monto" />
      </div>

      @if (monto !== null && esMontoInvalido) {
        <div class="alert alert-warning py-2 px-3 small" role="alert">
          Ingrese un monto mayor a S/ 0.00
        </div>
      }

      @if (esSaldoInsuficiente) {
        <div class="alert alert-danger py-2 px-3 small" role="alert">
          Saldo insuficiente para realizar el gasto
        </div>
      }

      <button
        type="submit"
        class="btn btn-primary w-100 mt-2"
        [disabled]="formularioInvalido">
        Registrar movimiento
      </button>
    </form>
  </div>
</div>
