<div class="container py-4">
  <div class="row g-4 justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span class="fw-semibold">Billetera Digital</span>
          <span class="badge bg-secondary">Padre</span>
        </div>

        <div class="card-body">
          <p class="text-muted mb-1">Saldo disponible</p>
          <h2 class="display-6 fw-bold text-success mb-4">
            S/ {{ saldo() | number:'1.2-2' }}
          </h2>

          <h5 class="fw-semibold mb-3">Movimientos</h5>

          @if (movimientos().length === 0) {
            <div class="alert alert-light border text-center text-muted mb-0">
              Aún no hay movimientos
            </div>
          } @else {
            <div class="d-flex flex-column gap-2">
              @for (mov of movimientos(); track mov.id) {
                <div class="border rounded p-2 px-3 d-flex justify-content-between align-items-center bg-light">
                  <span
                    class="badge px-3 py-2"
                    [class.bg-danger]="mov.tipo === 'Gasto'"
                    [class.bg-success]="mov.tipo === 'Recarga'">
                    {{ mov.tipo }}
                  </span>

                  <span
                    class="fw-bold"
                    [class.text-danger]="mov.tipo === 'Gasto'"
                    [class.text-success]="mov.tipo === 'Recarga'">
                    {{ mov.tipo === 'Gasto' ? '-' : '+' }} S/ {{ mov.monto | number:'1.2-2' }}
                  </span>
                </div>
              }
            </div>
          }
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6">
      <app-nuevo-movimiento
        [saldo]="saldo()"
        (movimientoValido)="procesarMovimiento($event)">
      </app-nuevo-movimiento>
    </div>
  </div>
</div>
